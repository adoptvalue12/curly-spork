_party_id uuid, p_key text, p_entry jsonb)\nreturns void\nlanguage plpgsql\nset search_path = ''\nas $$\ndeclare\n  v_old jsonb;\nbegin\n  if p_key is null or p_key !~ '^room:[A-Za-z0-9:_.-]{1,80}$' then\n    raise exception 'invalid_key' using errcode = '22023';\n  end if;\n  if p_entry is null or jsonb_typeof(p_entry) <> 'object' or not (p_entry ? 'ts')\n     or octet_length(p_entry::text) > 30000 then\n    raise exception 'invalid_entry' using errcode = '22023';\n  end if;\n\n  select s.state -> p_key into v_old\n    from public.party_state s\n   where s.party_id = p_party_id\n   for update;\n\n  if v_old is not null and (\n        coalesce((v_old ->> 'ts')::numeric, 0) > coalesce((p_entry ->> 'ts')::numeric, 0)\n     or (coalesce((v_old ->> 'ts')::numeric, 0) = coalesce((p_entry ->> 'ts')::numeric, 0)\n         and coalesce(v_old ->> 'by', '') >= coalesce(p_entry ->> 'by', ''))\n  ) then\n    return; -- une écriture plus récente est déjà enregistrée\n  end if;\n\n  update public.party_state s\n     set state = jsonb_set(coalesce(s.state, '{}'::jsonb), array[p_key], p_entry, true),\n         updated_at = now()\n   where s.party_id = p_party_id;\nend\n$$;\n\n-- ---------- 2) Rejoindre : bannis, party verrouillée, capacité ------------------\ncreate or replace function public.join_party(p_code text)\nreturns public.parties\nlanguage plpgsql\nsecurity definer\nset search_path = ''\nas $$\ndeclare\n  v_uid uuid := (select auth.uid());\n  v_party public.parties;\n  v_count int;\n  v_member boolean;\nbegin\n  if v_uid is null then\n    raise exception 'not_authenticated' using errcode = '28000';\n  end if;\n  select * into v_party from public.parties where code = upper(trim(p_code));\n  if not found then\n    raise exception 'party_not_found' using errcode = 'P0002';\n  end if;\n  select exists (\n    select 1 from public.party_members where party_id = v_party.id and user_id = v_uid\n  ) into v_member;\n  if not v_member then\n    if coalesce(v_party.settings -> 'banned', '[]'::jsonb) ? (v_uid::text) then\n      raise exception 'banned' using errcode = '42501';\n    end if;\n    if coalesce((v_party.settings ->> 'locked')::boolean, false) then\n      raise exception 'party_locked' using errcode = '42501';\n    end if;\n    select count(*) into v_count from public.party_members where party_id = v_party.id;\n    if v_count >= coalesce((v_party.settings ->> 'max_members')::int, 24) then\n      raise exception 'party_full' using errcode = '53400';\n    end if;\n    insert into public.party_members (party_id, user_id) values (v_party.id, v_uid)\n    on conflict do nothing;\n  end if;\n  return v_party;\nend\n$$;\n\n-- ---------- 3) Exclure un membre (hôte) et l'empêcher de revenir ---------------\ncreate or replace function public.kick_member(p_party_id uuid, p_user_id uuid)\nreturns void\nlanguage plpgsql\nsecurity definer\nset search_path = ''\nas $$\ndeclare\n  v_uid uuid := (select auth.uid());\nbegin\n  if v_uid is null then\n    raise exception 'not_authenticated' using errcode = '28000';\n  end if;\n  if not exists (select 1 from public.parties p where p.id = p_party_id and p.host_id = v_uid) then\n    raise exception 'not_host' using errcode = '42501';\n  end if;\n  if p_user_id = v_uid then\n    raise exception 'cannot_kick_self' using errcode = '22023';\n  end if;\n  delete from public.party_members where party_id = p_party_id and user_id = p_user_id;\n  update public.parties p\n     set settings = jsonb_set(\n           coalesce(p.settings, '{}'::jsonb), '{banned}',\n           coalesce(p.settings -> 'banned', '[]'::jsonb) || to_jsonb(p_user_id::text), true)\n   where p.id = p_party_id\n     and not (coalesce(p.settings -> 'banned', '[]'::jsonb) ? (p_user_id::text));\nend\n$$;\nrevoke all on function public.kick_member(uuid, uuid) from public, anon;\ngrant execute on function public.kick_member(uuid, uuid) to authenticated;\n\n-- ---------- 4) Secrets privés (rôles cachés, votes secrets, chuchotements) ------\n-- Seul le DESTINATAIRE peut lire une ligne (RLS). Écriture uniquement via put_secret().\ncreate table if not exists public.party_secrets (\n  party_id uuid not null references public.parties(id) on delete cascade,\n  to_user uuid not null references public.profiles(id) on delete cascade,\n  from_user uuid not null references public.profiles(id) on delete cascade,\n  key text not null check (char_length(key) between 1 and 120),\n  value jsonb not null check (octet_length(value::text) < 8000),\n  created_at timestamptz not null default now(),\n  primary key (party_id, to_user, from_user, key)\n);\ncreate index if not exists party_secrets_to_idx on public.party_secrets (to_user, party_id);\ncreate index if not exists party_secrets_from_idx on public.party_secrets (from_user);\nalter table public.party_secrets enable row level security;\n\ndrop policy if exists \"destinataire lit ses secrets\" on public.party_secrets;\ncreate policy \"destinataire lit ses secrets\" on public.party_secrets\n  for select to authenticated using (to_user = (select auth.uid()));\ndrop policy if exists \"expéditeur retire ses envois\" on public.party_secrets;\ncreate policy \"expéditeur retire ses envois\" on public.party_secrets\n  for delete to authenticated using (from_user = (select auth.uid()));\n\n-- Défense en profondeur : aucune écriture directe, aucun accès anonyme.\nrevoke all on public.party_secrets from anon;\nrevoke insert, update on public.party_secrets from authenticated;\n\ncreate or replace function public.put_secret(p_party_id uuid, p_to uuid, p_key text, p_value jsonb)\nreturns void\nlanguage plpgsql\nsecurity definer\nset search_path = ''\nas $$\ndeclare\n  v_uid uuid := (select auth.uid());\nbegin\n  if v_uid is null then\n    raise exception 'not_authenticated' using errcode = '28000';\n  end if;\n  if not exists (select 1 from public.party_members where party_id = p_party_id and user_id = v_uid) then\n    raise exception 'not_member' using errcode = '42501';\n  end if;\n  if not exists (select 1 from public.party_members where party_id = p_party_id and user_id = p_to) then\n    raise exception 'recipient_not_member' using errcode = '42501';\n  end if;\n  insert into public.party_secrets (party_id, to_user, from_user, key, value)\n  values (p_party_id, p_to, v_uid, p_key, coalesce(p_value, 'null'::jsonb))\n  on conflict (party_id, to_user, from_user, key)\n  do update set value = excluded.value, created_at = now();\nend\n$$;\nrevoke all on function public.put_secret(uuid, uuid, text, jsonb) from public, anon;\ngrant execute on function public.put_secret(uuid, uuid, text, jsonb) to authenticated;\n\n\n-- ###################################################################################################\n-- ## 20261011120000_party_tools.sql\n-- ###################################################################################################\n\n-- =====================================================================\n-- YunoParty : outils de gestion des parties (tableau de bord, réglages, hôte)\n-- Rejouable sans risque. À appliquer après 20261011000000_secrets_moderation.\n-- =====================================================================\n\n-- ---------- Mes parties : effectif + dernière activité en une seule requête ----\ncreate or replace function public.my_parties()\nreturns table (\n  id uuid, code text, name text, emoji text, host_id uuid, settings jsonb,\n  created_at timestamptz, member_count bigint, last_activity timestamptz\n)\nlanguage sql\nstable\nsecurity definer\nset search_path = ''\nas $$\n  select p.id, p.code, p.name, p.emoji, p.host_id,\n         coalesce(p.settings, '{}'::jsonb) - 'banned' as settings,\n         p.created_at,\n         (select count(*) from public.party_members m2 where m2.party_id = p.id) as member_count,\n         greatest(\n           coalesce((select s.updated_at from public.party_state s where s.party_id = p.id), p.created_at),\n           coalesce((select max(msg.created_at) from public.party_messages msg where msg.party_id = p.id), p.created_at)\n         ) as last_activity\n    from public.parties p\n    join public.party_members m on m.party_id = p.id and m.user_id = (select auth.uid())\n   order by last_activity desc\n$$;\nrevoke all on function public.my_parties() from public, anon;\ngrant execute on function public.my_parties() to authenticated;\n\n-- ---------- Réglages de la party (hôte uniquement) -----------------------------\n-- Ne touche jamais à settings.banned (réservé à kick_member).\ncreate or replace function public.update_party(\n  p_party_id uuid,\n  p_name text default null,\n  p_emoji text default null,\n  p_patch jsonb default '{}'::jsonb\n)\nreturns public.parties\nlanguage plpgsql\nsecurity definer\nset search_path = ''\nas $$\ndeclare\n  v_uid uuid := (select auth.uid());\n  v_party public.parties;\n  v_allowed constant text[] := array['locked', 'max_members', 'host_only_control', 'theme', 'hue', 'bg', 'mode', 'sound'];\n  v_key text;\n  v_settings jsonb;\nbegin\n  if v_uid is null then\n    raise exception 'not_authenticated' using errcode = '28000';\n  end if;\n  select * into v_party from public.parties where id = p_party_id for update;\n  if not found or v_party.host_id <> v_uid then\n    raise exception 'not_host' using errcode = '42501';\n  end if;\n  v_settings := coalesce(v_party.settings, '{}'::jsonb);\n  if p_patch is not null and jsonb_typeof(p_patch) = 'object' then\n    for v_key in select jsonb_object_keys(p_patch) loop\n      if v_key = any (v_allowed) then\n        if p_patch -> v_key = 'null'::jsonb then\n          v_settings := v_settings - v_key;\n        else\n          v_settings := jsonb_set(v_settings, array[v_key], p_patch -> v_key, true);\n        end if;\n      end if;\n    end loop;\n  end if;\n  if v_settings ? 'max_members' then\n    if jsonb_typeof(v_settings -> 'max_members') <> 'number' then\n      raise exception 'invalid_max_members' using errcode = '22023';\n    end if;\n    if (v_settings ->> 'max_members')::numeric not between 2 and 50 then\n      raise exception 'invalid_max_members' using errcode = '22023';\n    end if;\n  end if;\n  update public.parties p\n     set name = coalesce(nullif(left(trim(p_name), 60), ''), p.name),\n         emoji = coalesce(nullif(trim(p_emoji), ''), p.emoji),\n         settings = v_settings\n   where p.id = p_party_id\n   returning * into v_party;\n  return v_party;\nend\n$$;\nrevoke all on function public.update_party(uuid, text, text, jsonb) from public, anon;\ngrant execute on function public.update_party(uuid, text, text, jsonb) to authenticated;\n\n-- ---------- Passer le rôle d'hôte à un autre membre ----------------------------\ncreate or replace function public.transfer_host(p_party_id uuid, p_new_host uuid)\nreturns void\nlanguage plpgsql\nsecurity definer\nset search_path = ''\nas $$\ndeclare\n  v_uid uuid := (select auth.uid());\nbegin\n  if v_uid is null then\n    raise exception 'not_authenticated' using errcode = '28000';\n  end if;\n  if not exists (select 1 from public.parties where id = p_party_id and host_id = v_uid) then\n    raise exception 'not_host' using errcode = '42501';\n  end if;\n  if not exists (select 1 from public.party_members where party_id = p_party_id and user_id = p_new_host) then\n    raise exception 'not_member' using errcode = '42501';\n  end if;\n  update public.parties set host_id = p_new_host where id = p_party_id;\nend\n$$;\nrevoke all on function public.transfer_host(uuid, uuid) from public, anon;\ngrant execute on function public.transfer_host(uuid, uuid) to authenticated;\n\n-- ---------- Quitter une party (l'hôte qui part passe la main, ou la party disparaît) --\ncreate or replace function public.leave_party(p_party_id uuid)\nreturns void\nlanguage plpgsql\nsecurity definer\nset search_path = ''\nas $$\ndeclare\n  v_uid uuid := (select auth.uid());\n  v_host uuid;\n  v_next uuid;\nbegin\n  if v_uid is null then\n    raise exception 'not_authenticated' using errcode = '28000';\n  end if;\n  select host_id into v_host from public.parties where id = p_party_id for update;\n  if not found then\n    return;\n  end if;\n  delete from public.party_members where party_id = p_party_id and user_id = v_uid;\n  if v_host = v_uid then\n    select user_id into v_next from public.party_members\n     where party_id = p_party_id order by joined_at asc limit 1;\n    if v_next is null then\n      delete from public.parties where id = p_party_id;\n    else\n      update public.parties set host_id = v_next where id = p_party_id;\n    end if;\n  end if;\nend\n$$;\nrevoke all on function public.leave_party(uuid) from public, anon;\ngrant execute on function public.leave_party(uuid) to authenticated;\n\n\n-- ###################################################################################################\n-- ## 20261017000000_svg_defaults.sql\n-- ###################################################################################################\n\n-- YunoParty — avatars et icônes de party en SVG (plus aucun emoji dans l'interface).\n-- Les colonnes `profiles.avatar` et `parties.emoji` gardent leur nom et leur contrainte (1 à 16 caractères) : elles contiennent\n-- désormais un IDENTIFIANT d'illustration (« fox », « panda »… / « party », « popcorn »…). Les anciennes valeurs déjà\n-- enregistrées (un emoji) restent valides : le site les traduit en illustration au moment de l'affichage.\n-- Idempotent : peut être rejoué sans risque. À appliquer après la migration « core_schema ».\n\nalter table public.profiles alter column avatar set default 'robot';\nalter table public.parties  alter column emoji  set default 'party';\n\n-- Nouvel utilisateur : avatar tiré au hasard parmi les illustrations du site (sauf s'il en a choisi un à l'inscription).\ncreate or replace function public.handle_new_user()\nreturns trigger\nlanguage plpgsql\nsecurity definer\nset search_path = ''\nas $$\ndeclare\n  v_name text;\n  v_avatars text[] := array['fox','panda','frog','unicorn','octopus','alien','robot','tiger','lion','penguin','monkey','dog',\n                            'cat','owl','dragon','ghost','wizard','ninja','bat','dino','bunny','bear','pig','koala'];\n  v_colors text[] := array['#a78bfa','#f472b6','#fb923c','#34d399','#38bdf8','#facc15','#f87171','#2dd4bf'];\nbegin\n  v_name := nullif(trim(new.raw_user_meta_data->>'username'), '');\n  if v_name is null then\n    if coalesce(new.is_anonymous, false) then\n      v_name := 'Guest';\n    else\n      v_name := coalesce(nullif(split_part(coalesce(new.email, ''), '@', 1), ''), 'Player');\n    end if;\n  end if;\n  v_name := left(v_name, 24);\n  if char_length(v_name) < 2 then\n    v_name := v_name || floor(100 + random() * 900)::int::text;\n  end if;\n  insert into public.profiles (id, username, avatar, color)\n  values (\n    new.id,\n    v_name,\n    left(coalesce(nullif(new.raw_user_meta_data->>'avatar', ''), v_avatars[1 + floor(random() * array_length(v_avatars, 1))::int]), 16),\n    coalesce(nullif(new.raw_user_meta_data->>'color', ''), v_colors[1 + floor(random() * array_length(v_colors, 1))::int])\n  )\n  on conflict (id) do nothing;\n  return new;\nexception when others then\n  return new; -- ne jamais bloquer l'inscription ; le client recrée le profil si besoin\nend\n$$;\n\n-- Création d'une party : l'icône par défaut devient « party ».\ncreate or replace function public.create_party(p_name text, p_emoji text default 'party')\nreturns public.parties\nlanguage plpgsql\nsecurity definer\nset search_path = ''\nas $$\ndeclare\n  v_uid uuid := (select auth.uid());\n  v_code text;\n  v_party public.parties;\n  v_alphabet constant text := 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';\n  v_tries int := 0;\nbegin\n  if v_uid is null then\n    raise exception 'not_authenticated' using errcode = '28000';\n  end if;\n  if p_name is null or char_length(trim(p_name)) = 0 then\n    raise exception 'invalid_name' using errcode = '22023';\n  end if;\n  if (select count(*) from public.parties where host_id = v_uid) >= 30 then\n    raise exception 'too_many_parties' using errcode = '54000';\n  end if;\n  loop\n    v_code := '';\n    for i in 1..6 loop\n      v_code := v_code || substr(v_alphabet, 1 + floor(random() * length(v_alphabet))::int, 1);\n    end loop;\n    exit when not exists (select 1 from public.parties where code = v_code);\n    v_tries := v_tries + 1;\n    if v_tries > 25 then\n      raise exception 'code_generation_failed';\n    end if;\n  end loop;\n  insert into public.parties (code, name, emoji, host_id)\n  values (v_code, left(trim(p_name), 60), left(coalesce(nullif(trim(p_emoji), ''), 'party'), 16), v_uid)\n  returning * into v_party;\n  insert into public.party_members (party_id, user_id) values (v_party.id, v_uid);\n  insert into public.party_state (party_id) values (v_party.id);\n  return v_party;\nend\n$$;\n");
