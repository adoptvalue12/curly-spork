@charset "UTF-8";
/* =====================================================================
   YunoParty — design system (thèmes, composants, animations)
   Toutes les couleurs dérivent de --h (teinte) : le curseur « couleur »
   du site change donc tout le thème d'un coup.
   ===================================================================== */

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
img, svg, video, canvas { display: block; max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.1; margin: 0; letter-spacing: -.01em; }
p { margin: 0; }
[hidden] { display: none !important; }
::selection { background: color-mix(in srgb, var(--accent) 45%, transparent); }

/* ---------------------------------------------------------------- thèmes */
:root {
  --h: 265; --sat: 90%;
  --bg: hsl(var(--h) 45% 7%);
  --bg-2: hsl(var(--h) 40% 11%);
  --surface: hsl(var(--h) 38% 15% / .72);
  --surface-2: hsl(var(--h) 36% 21% / .85);
  --surface-solid: hsl(var(--h) 38% 14%);
  --border: hsl(var(--h) 70% 85% / .12);
  --border-strong: hsl(var(--h) 70% 85% / .24);
  --text: hsl(var(--h) 30% 96%);
  --muted: hsl(var(--h) 18% 72%);
  --accent: hsl(var(--h) var(--sat) 67%);
  --accent-2: hsl(calc(var(--h) + 55) 95% 68%);
  --accent-3: hsl(calc(var(--h) + 120) 90% 65%);
  --accent-ink: hsl(var(--h) 60% 8%);
  --grad: linear-gradient(135deg, var(--accent), var(--accent-2));
  --grad-3: linear-gradient(120deg, var(--accent), var(--accent-2), var(--accent-3));
  --good: #34d399; --bad: #fb7185; --warn: #fbbf24; --info: #38bdf8;
  --shadow: 0 18px 50px -18px hsl(var(--h) 90% 4% / .85);
  --glow: 0 0 0 1px var(--border), 0 10px 40px -10px hsl(var(--h) 95% 60% / .45);
  --radius: 18px; --radius-sm: 12px; --radius-lg: 28px;
  --font-display: 'Outfit', ui-rounded, 'Segoe UI', system-ui, sans-serif;
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --bounce: cubic-bezier(.34, 1.56, .64, 1);
  color-scheme: dark;
}
[data-theme="neon"]    { --h: 265; }
[data-theme="sunset"]  { --h: 14; }
[data-theme="ocean"]   { --h: 200; }
[data-theme="forest"]  { --h: 152; }
[data-theme="candy"] {
  --h: 330; --sat: 85%;
  --bg: hsl(var(--h) 100% 97%); --bg-2: hsl(var(--h) 90% 93%);
  --surface: hsl(0 0% 100% / .78); --surface-2: hsl(var(--h) 70% 96% / .95); --surface-solid: #fff;
  --border: hsl(var(--h) 40% 30% / .13); --border-strong: hsl(var(--h) 40% 30% / .25);
  --text: hsl(var(--h) 45% 14%); --muted: hsl(var(--h) 16% 42%);
  --accent: hsl(var(--h) var(--sat) 58%); --accent-2: hsl(calc(var(--h) + 45) 92% 60%);
  --accent-3: hsl(calc(var(--h) + 110) 80% 52%); --accent-ink: #fff;
  --shadow: 0 18px 40px -20px hsl(var(--h) 60% 40% / .35);
  --glow: 0 0 0 1px var(--border), 0 10px 30px -12px hsl(var(--h) 90% 55% / .45);
  color-scheme: light;
}
[data-theme="lemon"] {
  --h: 42; --sat: 95%;
  --bg: hsl(var(--h) 100% 96%); --bg-2: hsl(var(--h) 95% 91%);
  --surface: hsl(0 0% 100% / .8); --surface-2: hsl(var(--h) 80% 95% / .95); --surface-solid: #fff;
  --border: hsl(var(--h) 40% 25% / .14); --border-strong: hsl(var(--h) 40% 25% / .26);
  --text: hsl(var(--h) 50% 12%); --muted: hsl(var(--h) 18% 38%);
  --accent: hsl(var(--h) var(--sat) 50%); --accent-2: hsl(calc(var(--h) - 30) 95% 56%);
  --accent-3: hsl(calc(var(--h) + 100) 70% 45%); --accent-ink: hsl(var(--h) 80% 10%);
  --shadow: 0 18px 40px -20px hsl(var(--h) 60% 30% / .35);
  --glow: 0 0 0 1px var(--border), 0 10px 30px -12px hsl(var(--h) 95% 50% / .5);
  color-scheme: light;
}

/* ------------------------------------------------------------ utilitaires */
.row { display: flex; align-items: center; gap: 10px; }
.col { display: flex; flex-direction: column; gap: 10px; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1 1 0; min-width: 0; }
.center { text-align: center; justify-content: center; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.tiny { font-size: .74rem; }
.bold { font-weight: 700; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.grad-text {
  background: var(--grad-3); background-size: 200% auto; -webkit-background-clip: text; background-clip: text;
  color: transparent; animation: gradientShift 6s linear infinite;
}

/* ---------------------------------------------------------------- surfaces */
.glass {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3);
  box-shadow: var(--shadow);
}
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.card.hover { transition: transform .35s var(--ease), border-color .25s, box-shadow .35s; }
.card.hover:hover { transform: translateY(-4px); border-color: var(--border-strong); box-shadow: var(--glow); }

/* ----------------------------------------------------------------- boutons */
.btn {
  --bg-b: var(--surface-2);
  position: relative; overflow: hidden; isolation: isolate;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 18px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--bg-b); color: var(--text); font-weight: 600; font-size: .95rem; line-height: 1.2;
  transition: transform .2s var(--bounce), box-shadow .25s, background .25s, border-color .25s, opacity .2s;
  user-select: none; -webkit-tap-highlight-color: transparent; white-space: nowrap;
}
.btn:hover { transform: translateY(-2px); border-color: var(--border-strong); }
.btn:active { transform: translateY(0) scale(.97); }
.btn:focus-visible, .input:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn[disabled], .btn.disabled { opacity: .45; pointer-events: none; filter: saturate(.6); }
.btn.primary {
  background: var(--grad); color: var(--accent-ink); border-color: transparent;
  box-shadow: 0 8px 28px -8px hsl(var(--h) 95% 60% / .65);
}
.btn.primary::after {
  content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(110deg, transparent 30%, rgb(255 255 255 / .45) 50%, transparent 70%);
  transform: translateX(-120%); transition: transform .7s var(--ease);
}
.btn.primary:hover::after { transform: translateX(120%); }
.btn.primary:hover { box-shadow: 0 12px 34px -8px hsl(var(--h) 95% 60% / .8); }
.btn.ghost { background: transparent; }
.btn.soft { background: color-mix(in srgb, var(--accent) 16%, transparent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.btn.danger { background: color-mix(in srgb, var(--bad) 18%, transparent); border-color: color-mix(in srgb, var(--bad) 40%, transparent); color: var(--bad); }
.btn.good { background: color-mix(in srgb, var(--good) 20%, transparent); border-color: color-mix(in srgb, var(--good) 45%, transparent); }
.btn.sm { padding: 6px 12px; font-size: .84rem; }
.btn.lg { padding: 14px 28px; font-size: 1.08rem; }
.btn.icon { padding: 0; width: 42px; height: 42px; font-size: 1.15rem; flex: none; }
.btn.icon.sm { width: 34px; height: 34px; font-size: 1rem; }
.btn.on { background: color-mix(in srgb, var(--accent) 28%, var(--surface-2)); border-color: var(--accent); }
.btn.red { background: color-mix(in srgb, var(--bad) 30%, var(--surface-2)); border-color: var(--bad); }
.ripple { position: absolute; border-radius: 50%; background: rgb(255 255 255 / .35); transform: scale(0); animation: ripple .65s ease-out forwards; pointer-events: none; z-index: -1; }

/* ------------------------------------------------------------------ champs */
.input, select.input, textarea.input {
  width: 100%; padding: 11px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border);
  background: color-mix(in srgb, var(--surface-solid) 70%, transparent); color: var(--text);
  transition: border-color .2s, box-shadow .2s, background .2s;
}
.input::placeholder { color: var(--muted); opacity: .75; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
textarea.input { resize: vertical; min-height: 80px; }
label.field { display: flex; flex-direction: column; gap: 6px; font-size: .86rem; color: var(--muted); font-weight: 600; }
.range { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; border-radius: 99px; background: var(--grad-3); outline: none; }
.range::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); box-shadow: 0 2px 10px rgb(0 0 0 / .4); cursor: grab; }
.range::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); cursor: grab; }
.switch { position: relative; width: 46px; height: 26px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--border-strong); transition: background .25s; }
.switch i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--text); transition: transform .3s var(--bounce); }
.switch input:checked + i { background: var(--grad); border-color: transparent; }
.switch input:checked + i::after { transform: translateX(20px); background: #fff; }

/* ------------------------------------------------- avatars, puces, badges */
.av {
  --sz: 36px; --c: var(--accent);
  position: relative; flex: none; width: var(--sz); height: var(--sz); border-radius: 50%;
  display: inline-grid; place-items: center; line-height: 1;
  background: radial-gradient(circle at 32% 24%, color-mix(in srgb, var(--c) 55%, #fff 6%), color-mix(in srgb, var(--c) 34%, var(--surface-solid)) 72%);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 75%, transparent);
  user-select: none;
}
.av .av-art { width: 100%; height: 100%; display: block; filter: drop-shadow(0 1px 1px #0003); }
/* icône de party (pastille arrondie) et réaction / sticker (pastille ronde) : dessinées en SVG */
.pi {
  --sz: 44px; flex: none; width: var(--sz); height: var(--sz); border-radius: calc(var(--sz) * .32); display: inline-grid; place-items: center; color: #fff;
  background: linear-gradient(145deg, var(--accent), var(--accent-2));
  box-shadow: inset 0 1px 0 #fff4, 0 8px 18px -10px var(--accent);
}
.pi svg { filter: drop-shadow(0 1px 1px #0003); }
.rx {
  --sz: 40px; --rc: #fbbf24; flex: none; width: var(--sz); height: var(--sz); border-radius: 50%; display: inline-grid; place-items: center; color: var(--rc);
  background: radial-gradient(circle at 30% 24%, color-mix(in srgb, var(--rc) 42%, transparent), color-mix(in srgb, var(--rc) 14%, var(--surface-solid)));
  box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--rc) 55%, transparent), 0 8px 22px -10px var(--rc);
}
.av.speaking { animation: speakRing 1s ease-out infinite; }
.av.sm { --sz: 26px; } .av.lg { --sz: 52px; } .av.xl { --sz: 84px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 4px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--border); font-size: .85rem; font-weight: 600; max-width: 100%; }
.chip .av { --sz: 22px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 11px; border-radius: 99px; background: color-mix(in srgb, var(--accent) 16%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); font-size: .78rem; font-weight: 600; }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--bad); color: #fff; font-size: .7rem; font-weight: 800; display: inline-grid; place-items: center; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); display: inline-block; }
.kbd { font-family: ui-monospace, monospace; font-size: .75rem; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--border-strong); background: var(--surface-2); }

/* -------------------------------------------------------- onglets, modales */
.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: transparent; padding: 8px 16px; border-radius: 99px; font-weight: 600; color: var(--muted); transition: color .2s, background .25s; display: inline-flex; align-items: center; gap: 7px; position: relative; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent-ink); background: var(--grad); box-shadow: 0 6px 18px -6px hsl(var(--h) 95% 60% / .7); }
.modal-back { position: fixed; inset: 0; z-index: 900; display: grid; place-items: center; padding: 16px; background: rgb(5 3 15 / .62); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: fadeIn .25s ease both; }
.modal { width: min(560px, 100%); max-height: min(88dvh, 800px); overflow: auto; background: var(--surface-solid); border: 1px solid var(--border-strong); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow), var(--glow); animation: popIn .45s var(--bounce) both; }
.modal.wide { width: min(980px, 100%); }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.modal-head h3 { font-size: 1.4rem; }
.toasts { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(92vw, 460px); }
.toast { pointer-events: auto; padding: 11px 18px; border-radius: 99px; background: var(--surface-solid); border: 1px solid var(--border-strong); box-shadow: var(--shadow), var(--glow); font-weight: 600; font-size: .92rem; display: flex; align-items: center; gap: 10px; animation: toastIn .5s var(--bounce) both; max-width: 100%; }
.toast.out { animation: toastOut .35s var(--ease) both; }
.toast.err { border-color: var(--bad); }
.toast.ok { border-color: var(--good); }
.toast .btn { margin-left: 4px; }
.skeleton { border-radius: 10px; background: linear-gradient(100deg, var(--surface) 30%, var(--surface-2) 50%, var(--surface) 70%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid color-mix(in srgb, var(--accent) 25%, transparent); border-top-color: var(--accent); animation: spin .8s linear infinite; }

* { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--accent) 40%, transparent) transparent; }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 99px; }

/* -------------------------------------------------------------- animations */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes popIn { from { opacity: 0; transform: scale(.88) translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
@keyframes float { 0%, 100% { transform: translateY(0) rotate(var(--r, 0deg)); } 50% { transform: translateY(-14px) rotate(calc(var(--r, 0deg) + 4deg)); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulseRing { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); } 100% { box-shadow: 0 0 0 16px transparent; } }
@keyframes speakRing { 0% { box-shadow: 0 0 0 2px var(--good), 0 0 0 2px color-mix(in srgb, var(--good) 60%, transparent); } 100% { box-shadow: 0 0 0 2px var(--good), 0 0 0 12px transparent; } }
@keyframes gradientShift { to { background-position: 200% center; } }
@keyframes shimmer { to { background-position: -200% 0; } }
@keyframes wiggle { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
@keyframes bounceIn { 0% { opacity: 0; transform: scale(.3); } 55% { opacity: 1; transform: scale(1.12); } 80% { transform: scale(.95); } 100% { transform: scale(1); } }
@keyframes flipIn { from { opacity: 0; transform: perspective(700px) rotateX(-70deg) scale(.95); } to { opacity: 1; transform: perspective(700px) rotateX(0); } }
@keyframes slideInRight { from { opacity: 0; transform: translateX(26px); } to { opacity: 1; transform: none; } }
@keyframes slideInLeft { from { opacity: 0; transform: translateX(-26px); } to { opacity: 1; transform: none; } }
@keyframes heartbeat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.14); } 30% { transform: scale(1); } 45% { transform: scale(1.1); } }
@keyframes ripple { to { transform: scale(4); opacity: 0; } }
@keyframes toastIn { from { opacity: 0; transform: translateY(24px) scale(.9); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(14px) scale(.95); } }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
@keyframes floatUp { 0% { opacity: 0; transform: translateY(0) scale(.5); } 12% { opacity: 1; transform: translateY(-30px) scale(1.15); } 100% { opacity: 0; transform: translateY(-260px) translateX(var(--dx, 0)) scale(1); } }
@keyframes marquee { to { transform: translateX(-50%); } }

.a-fade { animation: fadeIn .5s var(--ease) both; animation-delay: var(--d, 0s); }
.a-up { animation: fadeUp .7s var(--ease) both; animation-delay: var(--d, 0s); }
.a-pop { animation: popIn .6s var(--bounce) both; animation-delay: var(--d, 0s); }
.a-bounce { animation: bounceIn .7s var(--bounce) both; animation-delay: var(--d, 0s); }
.a-flip { animation: flipIn .6s var(--ease) both; animation-delay: var(--d, 0s); }
.a-float { animation: float 6s ease-in-out infinite; animation-delay: var(--d, 0s); }
.a-wiggle { animation: wiggle 1.4s ease-in-out infinite; }
.a-shake { animation: shake .5s ease both; }
.a-spin { animation: spin 1.2s linear infinite; }
.a-heart { animation: heartbeat 1.6s ease-in-out infinite; }
.a-in-right { animation: slideInRight .45s var(--ease) both; }
.a-in-left { animation: slideInLeft .45s var(--ease) both; }
.reveal { opacity: 0; transform: translateY(28px); transition: opacity .8s var(--ease), transform .8s var(--ease); transition-delay: var(--d, 0s); }
.reveal.in { opacity: 1; transform: none; }

/* Animations réduites (réglage du site ou préférence système) */
[data-anim="off"] *, [data-anim="off"] *::before, [data-anim="off"] *::after {
  animation-duration: .001ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; transition-delay: 0s !important; scroll-behavior: auto !important;
}
[data-anim="off"] .reveal { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  html:not([data-anim="on"]) *, html:not([data-anim="on"]) *::before, html:not([data-anim="on"]) *::after {
    animation-duration: .001ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; transition-delay: 0s !important; scroll-behavior: auto !important;
  }
  html:not([data-anim="on"]) .reveal { opacity: 1; transform: none; }
}

/* =====================================================================
   YunoParty — habillage de l'application : fond, logo, accueil, connexion,
   mes parties, invitation, fenêtres, réglages.  (le salon : room.css)
   ===================================================================== */

#app { min-height: 100dvh; display: flex; flex-direction: column; }
#view { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* ------------------------------------------------------------------ fond animé */
#bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; background: radial-gradient(1100px 760px at 82% -8%, hsl(var(--h) 70% 24% / .6), transparent 62%), var(--bg); }
[data-theme="candy"] #bg, [data-theme="lemon"] #bg { background: radial-gradient(1100px 760px at 82% -8%, hsl(var(--h) 95% 86% / .95), transparent 62%), var(--bg); }
.blob { position: absolute; border-radius: 50%; filter: blur(72px); opacity: .6; animation: blobMove 24s ease-in-out infinite alternate; will-change: transform; }
.blob.b1 { width: 46vmax; height: 46vmax; left: -12vmax; top: -14vmax; background: hsl(var(--h) 90% 55% / .55); }
.blob.b2 { width: 40vmax; height: 40vmax; right: -10vmax; top: 18vh; background: hsl(calc(var(--h) + 60) 90% 55% / .42); animation-duration: 30s; animation-delay: -6s; }
.blob.b3 { width: 34vmax; height: 34vmax; left: 24vw; bottom: -18vmax; background: hsl(calc(var(--h) + 130) 85% 55% / .34); animation-duration: 34s; animation-delay: -12s; }
.blob.soft { opacity: .32; }
[data-theme="candy"] .blob, [data-theme="lemon"] .blob { opacity: .42; }
@keyframes blobMove { to { transform: translate3d(7vmax, 5vmax, 0) scale(1.15) rotate(25deg); } }
.bg-noise { position: absolute; inset: 0; opacity: .07; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); mix-blend-mode: overlay; }
.bg-grid { position: absolute; inset: -48px 0 0 0; background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px); background-size: 48px 48px; -webkit-mask-image: radial-gradient(ellipse at 50% 25%, #000 15%, transparent 72%); mask-image: radial-gradient(ellipse at 50% 25%, #000 15%, transparent 72%); animation: gridMove 6s linear infinite; }
@keyframes gridMove { to { transform: translateY(48px); } }
.star { position: absolute; left: var(--x); top: var(--y); width: var(--s); height: var(--s); border-radius: 50%; background: #fff; box-shadow: 0 0 8px 1px rgb(255 255 255 / .7); opacity: .2; animation: twinkle var(--t) ease-in-out infinite; animation-delay: var(--d); }
[data-theme="candy"] .star, [data-theme="lemon"] .star { background: var(--accent); box-shadow: 0 0 8px 1px var(--accent); }
@keyframes twinkle { 50% { opacity: .95; transform: scale(1.5); } }

/* ------------------------------------------------------------------ logo, écran de démarrage */
.logo { display: inline-flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none !important; }
.logo-text { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; letter-spacing: -.02em; }
.logo-mark { flex: none; }
.logo-mark .logo-y { stroke-dasharray: 60; stroke-dashoffset: 60; animation: drawY 1s .2s var(--ease) forwards; }
.logo-mark .logo-c1 { animation: float 3.2s ease-in-out infinite; }
.logo-mark .logo-c2 { animation: wiggle 2.6s ease-in-out infinite; transform-origin: 10px 38px; }
.logo-mark .logo-c3 { animation: pop 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes drawY { to { stroke-dashoffset: 0; } }
.logo:hover .logo-mark { animation: wiggle .5s ease 2; }
.splash { position: fixed; inset: 0; display: grid; place-items: center; z-index: 5; }
.splash-in { display: flex; flex-direction: column; align-items: center; gap: 18px; animation: popIn .7s var(--bounce) both; }
.splash-text { font-family: var(--font-display); font-weight: 800; font-size: 2.1rem; }
.splash .logo-mark { animation: float 3s ease-in-out infinite; filter: drop-shadow(0 12px 30px hsl(var(--h) 90% 55% / .6)); }

/* ------------------------------------------------------------------ barre du haut */
.topbar { position: sticky; top: 0; z-index: 60; display: flex; align-items: center; gap: 12px; padding: 10px clamp(14px, 3vw, 32px); background: color-mix(in srgb, var(--bg) 62%, transparent); -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4); border-bottom: 1px solid var(--border); }
.topbar .spacer { flex: 1; }
.topbar > a:first-child { flex: none; }
.tb-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
.me-chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 14px 4px 4px; border-radius: 99px; border: 1px solid var(--border); background: var(--surface-2); font-weight: 700; cursor: pointer; max-width: 200px; transition: transform .2s var(--bounce), border-color .2s; }
.me-chip:hover { transform: translateY(-2px); border-color: var(--border-strong); }
.demo-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 99px; font-size: .76rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; background: color-mix(in srgb, var(--warn) 22%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 55%, transparent); color: var(--warn); cursor: help; }
.demo-banner { margin: 12px clamp(14px, 3vw, 32px) 0; padding: 10px 16px; border-radius: var(--radius-sm); font-size: .88rem; background: color-mix(in srgb, var(--warn) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); }
.lang-btn { font-weight: 800; font-size: .8rem; letter-spacing: .05em; }

.page { width: 100%; max-width: 1120px; margin: 0 auto; padding: clamp(18px, 4vw, 40px) clamp(14px, 3vw, 32px) 60px; }
.page-in { animation: fadeUp .6s var(--ease) both; }
.view-out { animation: fadeIn .18s reverse both; }

/* ------------------------------------------------------------------ accueil (landing) */
.hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: clamp(20px, 5vw, 70px); align-items: center; min-height: min(78dvh, 720px); }
.hero-kicker { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 18px; }
.hero h1 { font-size: clamp(2.5rem, 6.4vw, 4.8rem); font-weight: 900; line-height: 1.02; letter-spacing: -.035em; }
.hero h1 .grad-text { display: inline-block; }
.hero-sub { margin-top: 20px; font-size: clamp(1.02rem, 1.8vw, 1.22rem); color: var(--muted); max-width: 34em; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
.hero-cta .btn.lg { box-shadow: 0 12px 34px -10px hsl(var(--h) 95% 60% / .7); }
.hero-trust { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 26px; }

.hero-art { position: relative; width: min(540px, 100%); aspect-ratio: 1.12; margin-inline: auto; }
.hero-glow { position: absolute; inset: 8% 4%; border-radius: 50%; background: radial-gradient(circle, hsl(var(--h) 95% 62% / .55), transparent 66%); filter: blur(30px); animation: pulseGlow 5s ease-in-out infinite; }
@keyframes pulseGlow { 50% { transform: scale(1.12); opacity: .75; } }
.hero-screen { position: absolute; left: 11%; right: 11%; top: 17%; animation: float 7s ease-in-out infinite; --r: -1.5deg; filter: drop-shadow(0 26px 40px hsl(var(--h) 90% 5% / .55)); }
.hero-screen-svg { width: 100%; height: auto; }
.hero-sun { animation: pulse 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 50% { transform: scale(1.12); } }
.hero-play-halo { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.hero-progress { transform-box: fill-box; transform-origin: left center; animation: heroProgress 9s linear infinite; }
@keyframes heroProgress { from { transform: scaleX(.04); } to { transform: scaleX(1); } }
.hero-cursor { position: absolute; filter: drop-shadow(0 4px 6px rgb(0 0 0 / .35)); }
.hero-cursor.c1 { left: 18%; top: 28%; animation: cur1 9s ease-in-out infinite; }
.hero-cursor.c2 { left: 62%; top: 52%; animation: cur2 11s ease-in-out infinite; }
.hero-cursor.c3 { left: 40%; top: 66%; animation: cur3 8s ease-in-out infinite; }
@keyframes cur1 { 0%, 100% { transform: translate(0, 0); } 33% { transform: translate(120px, 24px); } 66% { transform: translate(60px, 80px); } }
@keyframes cur2 { 0%, 100% { transform: translate(0, 0); } 40% { transform: translate(-110px, -30px); } 75% { transform: translate(-30px, -70px); } }
@keyframes cur3 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(110px, -50px); } }
.hero-face { position: absolute; width: 18%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-size: clamp(1.5rem, 5vw, 2.6rem); background: color-mix(in srgb, var(--c) 28%, var(--surface-solid)); box-shadow: 0 0 0 3px var(--c), 0 14px 30px -10px rgb(0 0 0 / .5); animation: float 5.5s ease-in-out infinite; animation-delay: var(--d); }
.hero-face.f1 { left: 0; top: 4%; } .hero-face.f2 { right: 2%; top: 0; } .hero-face.f3 { left: -2%; bottom: 20%; }
.hero-face.f4 { right: -2%; bottom: 24%; } .hero-face.f5 { left: 20%; bottom: -2%; } .hero-face.f6 { right: 18%; bottom: 0; }
.hero-face.f2, .hero-face.f5 { animation: speakRing 1.6s ease-out infinite, float 6s ease-in-out infinite; animation-delay: 0s, var(--d); }
.hero-bubble { position: absolute; display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 18px 18px 18px 4px; background: var(--surface-solid); border: 1px solid var(--border-strong); box-shadow: var(--shadow); font-weight: 700; animation: bubblePop 6s ease-in-out infinite; }
.hero-bubble.b1 { left: 14%; top: 22%; } .hero-bubble.b2 { right: 6%; top: 44%; animation-delay: -2s; border-radius: 18px 18px 4px 18px; } .hero-bubble.b3 { left: 3%; top: 56%; animation-delay: -4s; padding: 12px 14px; }
.hero-bubble em { font-style: normal; font-size: .9rem; }
@keyframes bubblePop { 0%, 8% { opacity: 0; transform: scale(.4) translateY(10px); } 14%, 78% { opacity: 1; transform: none; } 90%, 100% { opacity: 0; transform: translateY(-14px); } }
.typing { display: inline-flex; gap: 4px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: typingDot 1.2s ease-in-out infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes typingDot { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }
.hero-mic { position: absolute; left: 50%; bottom: 3%; transform: translateX(-50%); padding: 10px 16px; border-radius: 99px; background: var(--surface-solid); border: 1px solid var(--border-strong); box-shadow: var(--shadow); }
.hero-wave { display: flex; align-items: center; gap: 4px; height: 26px; }
.hero-wave i { width: 5px; height: 100%; border-radius: 4px; background: var(--grad); transform-origin: center; animation: wave 1s ease-in-out infinite; animation-delay: calc(var(--i) * -.13s); }
@keyframes wave { 0%, 100% { transform: scaleY(.2); } 50% { transform: scaleY(1); } }
.hero-chip { position: absolute; font-size: 1.9rem; animation: float 5s ease-in-out infinite; filter: drop-shadow(0 6px 10px rgb(0 0 0 / .35)); }
.hero-chip.c-dice { right: 22%; top: 8%; --r: 12deg; } .hero-chip.c-game { left: 8%; top: 40%; animation-delay: -1.5s; } .hero-chip.c-pop { right: 8%; bottom: 40%; animation-delay: -3s; } .hero-chip.c-star { left: 36%; top: 2%; animation-delay: -2s; }

.section { margin-top: clamp(50px, 9vw, 110px); }
.section-title { text-align: center; font-size: clamp(1.7rem, 4vw, 2.6rem); font-weight: 800; margin-bottom: 34px; }
.features { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 18px; }
.feat { display: flex; flex-direction: column; gap: 12px; padding: 24px; }
.feat h3 { font-size: 1.25rem; } .feat p { color: var(--muted); font-size: .95rem; }
.feat-ic { width: 54px; height: 54px; border-radius: 18px; display: grid; place-items: center; color: var(--accent-ink); background: var(--grad); box-shadow: 0 12px 26px -10px hsl(var(--h) 95% 60% / .7); transition: transform .5s var(--bounce); }
.feat:hover .feat-ic { transform: rotate(-8deg) scale(1.1); }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; counter-reset: step; }
.step { position: relative; text-align: center; padding: 26px 18px; }
.step::before { counter-increment: step; content: counter(step); display: grid; place-items: center; width: 46px; height: 46px; margin: 0 auto 14px; border-radius: 50%; font: 800 1.3rem var(--font-display); color: var(--accent-ink); background: var(--grad); box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 20%, transparent); }
.step p { color: var(--muted); margin-top: 6px; font-size: .94rem; }
.theme-strip { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.theme-dot { display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); font-weight: 700; transition: transform .25s var(--bounce), border-color .25s; }
.theme-dot:hover { transform: translateY(-3px) scale(1.04); border-color: var(--border-strong); }
.theme-dot.on { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent); }
.theme-dot i { width: 28px; height: 28px; border-radius: 50%; background: conic-gradient(from 200deg, hsl(var(--th) 90% 62%), hsl(calc(var(--th) + 60) 90% 62%), hsl(calc(var(--th) + 120) 85% 60%), hsl(var(--th) 90% 62%)); }
.cta-band { text-align: center; padding: clamp(30px, 6vw, 60px) 20px; border-radius: var(--radius-lg); background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 28%, var(--surface-solid)), color-mix(in srgb, var(--accent-2) 22%, var(--surface-solid))); border: 1px solid var(--border-strong); box-shadow: var(--shadow), var(--glow); }
.footer { padding: 30px 16px 40px; text-align: center; color: var(--muted); font-size: .9rem; }

/* ------------------------------------------------------------------ connexion / inscription / invitation */
.auth-wrap { flex: 1; display: grid; place-items: center; padding: 24px 16px 60px; }
.auth-card { width: min(460px, 100%); padding: clamp(22px, 4vw, 34px); border-radius: var(--radius-lg); animation: popIn .6s var(--bounce) both; }
.auth-card h2 { font-size: 1.9rem; margin-bottom: 4px; }
.auth-card .sub { color: var(--muted); margin-bottom: 18px; }
.auth-card .tabs { margin: 16px 0 20px; }
.auth-card .tab { flex: 1; justify-content: center; }
.form { display: flex; flex-direction: column; gap: 14px; }
.form-error { padding: 10px 14px; border-radius: var(--radius-sm); background: color-mix(in srgb, var(--bad) 16%, transparent); border: 1px solid color-mix(in srgb, var(--bad) 45%, transparent); color: var(--text); font-size: .9rem; font-weight: 600; }
.form-ok { padding: 10px 14px; border-radius: var(--radius-sm); background: color-mix(in srgb, var(--good) 16%, transparent); border: 1px solid color-mix(in srgb, var(--good) 45%, transparent); font-size: .9rem; font-weight: 600; }
.field-hint { font-weight: 500; }
.divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: .82rem; margin: 6px 0; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; font-size: .88rem; text-decoration: none; }
.linkish:hover { text-decoration: underline; }
.mail-art { font-size: 3.4rem; text-align: center; animation: float 3s ease-in-out infinite; }
.picker-block { display: flex; flex-direction: column; gap: 8px; }
.picker-block > span { font-size: .86rem; color: var(--muted); font-weight: 600; }
.invite-card { text-align: center; }
.invite-card .big-icon { margin-bottom: 8px; display: inline-grid; animation: bounceIn .9s var(--bounce) both, float 4s 1s ease-in-out infinite; }
.invite-card h2 { font-size: 1.6rem; }
.invite-card .party-title { font-size: 2rem; font-weight: 900; margin: 6px 0 10px; }
.invite-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.code-badge { display: inline-block; font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace; letter-spacing: .18em; font-weight: 800; padding: 4px 14px; border-radius: 10px; background: var(--surface-2); border: 1px dashed var(--border-strong); }

/* ------------------------------------------------------------------ mes parties */
.home-head { display: flex; align-items: center; gap: 16px; margin-bottom: 26px; flex-wrap: wrap; }
.home-head h1 { font-size: clamp(1.8rem, 4.4vw, 2.8rem); font-weight: 900; }
.home-head .sub { color: var(--muted); }
.home-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; }
.card h3 { font-size: 1.25rem; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
.create-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.create-row .grow { min-width: 200px; }
.emoji-pick-row { margin: 12px 0 16px; }
.join-row { display: flex; gap: 8px; }
.guest-banner { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 18px; margin-bottom: 18px; border-radius: var(--radius); background: color-mix(in srgb, var(--warn) 13%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 42%, transparent); }
.guest-banner .grow { min-width: 200px; }
.party-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; margin-top: 16px; }
.party-card { position: relative; display: flex; flex-direction: column; gap: 12px; padding: 18px; overflow: hidden; animation: fadeUp .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 60ms); }
.party-card::before { content: ''; position: absolute; inset: auto -30% -60% auto; width: 70%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 30%, transparent), transparent 70%); pointer-events: none; transition: transform .6s var(--ease); }
.party-card:hover::before { transform: scale(1.5); }
.party-top { display: flex; align-items: center; gap: 14px; }
.party-card .pi { transition: transform .4s var(--bounce); }
.party-card:hover .pi { transform: rotate(-8deg) scale(1.1); }
.party-name { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; }
.party-meta { display: flex; flex-wrap: wrap; gap: 6px; color: var(--muted); font-size: .8rem; }
.party-actions { display: flex; gap: 8px; margin-top: auto; }
.party-actions .btn.primary { flex: 1; }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 30px 10px; color: var(--muted); }
.empty h4 { color: var(--text); font-size: 1.2rem; }
.empty-art .hat { animation: wiggle 3s ease-in-out infinite; transform-origin: 84px 112px; }
.empty-art .conf { animation: float 3.4s ease-in-out infinite; }
.empty-art .c2 { animation-delay: -1s; } .empty-art .c3 { animation-delay: -2s; } .empty-art .c4 { animation-delay: -.5s; }

/* ------------------------------------------------------------------ fenêtres, sélecteurs */
.modal-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.modal-float { position: absolute; right: 14px; top: 14px; z-index: 2; }
.modal { position: relative; }
.pick-grid { display: grid; grid-template-columns: repeat(var(--cols, 8), minmax(0, 1fr)); gap: 6px; }
.pick-btn { aspect-ratio: 1; min-width: 0; padding: 3px; display: grid; place-items: center; border-radius: 14px; border: 2px solid transparent; background: transparent; transition: transform .2s var(--bounce), background .2s, border-color .2s; }
.pick-btn > * { --sz: 100% !important; width: 100%; height: 100%; max-width: 46px; max-height: 46px; margin: auto; aspect-ratio: 1; }
.pick-btn:hover { transform: translateY(-2px) scale(1.08); background: var(--surface-2); }
.pick-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pick-btn.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 22%, transparent); }
.rx-grid { gap: 4px; }
.rx-grid .pick-btn > * { max-width: 44px; max-height: 44px; }
.color-row { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { width: 30px; height: 30px; border-radius: 50%; border: 3px solid transparent; background: var(--c); transition: transform .2s var(--bounce); box-shadow: 0 4px 10px -3px var(--c); }
.swatch:hover { transform: scale(1.18); }
.swatch.sel { border-color: var(--text); transform: scale(1.12); }
.popover { position: fixed; z-index: 950; padding: 10px; border-radius: var(--radius); background: var(--surface-solid); border: 1px solid var(--border-strong); box-shadow: var(--shadow), var(--glow); animation: popIn .25s var(--bounce) both; max-width: calc(100vw - 16px); }
.emoji-popover { width: min(340px, calc(100vw - 16px)); }
.sticker-pop .pick-grid { --cols: 4; }
/* telephone : zones tactiles confortables (>= 44 px) plutot que 8 colonnes serrees */
@media (max-width: 560px) {
  .pick-grid.av-grid, .pick-grid.pi-grid { grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 4px; }
  .swatch { width: 40px; height: 40px; }
  .color-row { gap: 6px; }
}
.btn.armed { background: color-mix(in srgb, var(--bad) 40%, var(--surface-2)); border-color: var(--bad); }
.spinner.sm { width: 14px; height: 14px; border-width: 2px; }

/* ------------------------------------------------------------------ réglages */
.set-body { display: flex; flex-direction: column; gap: 22px; min-height: 280px; }
.set-tabs { margin-bottom: 16px; }
.set-sec { display: flex; flex-direction: column; gap: 10px; }
.set-sec > h4 { font-size: .8rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-family: var(--font); font-weight: 800; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.theme-card { position: relative; padding: 0; overflow: hidden; border-radius: 16px; border: 2px solid var(--border); background: var(--surface-2); text-align: left; transition: transform .25s var(--bounce), border-color .2s; }
.theme-card:hover { transform: translateY(-3px); }
.theme-card.sel { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
.theme-card .sw { height: 54px; background: linear-gradient(135deg, hsl(var(--th) 90% 60%), hsl(calc(var(--th) + 55) 95% 66%), hsl(calc(var(--th) + 120) 90% 62%)); }
.theme-card span { display: block; padding: 8px 12px; font-weight: 700; font-size: .9rem; }
.seg { display: inline-flex; padding: 3px; gap: 3px; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 99px; font-weight: 700; font-size: .86rem; color: var(--muted); }
.seg button.on { background: var(--grad); color: var(--accent-ink); }
.hue-range { background: linear-gradient(90deg, hsl(0 90% 60%), hsl(60 90% 60%), hsl(120 80% 55%), hsl(180 90% 55%), hsl(240 90% 65%), hsl(300 90% 62%), hsl(360 90% 60%)); }

/* ------------------------------------------------------------------ adaptation mobile */
@media (max-width: 880px) {
  .hero { grid-template-columns: 1fr; text-align: center; min-height: 0; }
  .hero-sub { margin-inline: auto; } .hero-cta, .hero-trust { justify-content: center; }
  .hero-art { order: -1; width: min(400px, 92%); }
  .steps { grid-template-columns: 1fr; }
  .home-grid { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .topbar { gap: 6px; padding-inline: 12px; } .logo { gap: 7px; } .logo-text { font-size: 1.1rem; }
  .tb-right { gap: 4px; } .tb-right .btn.sm { padding-inline: 10px; } .lang-btn svg { display: none; }
  .me-chip span.nm { display: none; } .me-chip { padding-right: 4px; }
  .hide-sm { display: none !important; }
  .demo-pill .dp-txt { display: none; } .demo-pill { padding: 6px 8px; }
  .join-row { flex-direction: column; }
  .modal { padding: 18px; border-radius: 22px; }
}
@media (max-width: 400px) { .topbar .demo-pill { display: none; } }      /* la bannière « mode démo » juste dessous le dit déjà */
@media (max-width: 340px) { .topbar .logo-text { display: none; } }      /* très petits écrans : l'icône du logo suffit */

/* blocs d'icônes (anciennement des emoji) */
.big-ico { display: grid; place-items: center; margin-bottom: 10px; color: var(--accent); animation: float 4s ease-in-out infinite; }
.mail-art { display: grid; place-items: center; color: var(--accent); }
.guest-ico { display: inline-grid; place-items: center; width: 46px; height: 46px; border-radius: 14px; background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); flex: none; }
.foot-heart { display: inline-block; margin-left: 6px; vertical-align: -2px; color: var(--bad); animation: heartBeat 2.4s ease-in-out infinite; }
@keyframes heartBeat { 0%, 60%, 100% { transform: scale(1); } 20% { transform: scale(1.25); } 40% { transform: scale(1.08); } }
.invite-card .big-icon .pi { box-shadow: var(--glow), inset 0 1px 0 #fff4; }
.hero-face .av-art { width: 100%; height: 100%; padding: 5%; }
.hero-bubble .rx { margin: -4px 0; }
.hero-chip { color: var(--accent-2); font-size: 0; }
.hero-chip.c-game { color: var(--accent); } .hero-chip.c-pop { color: #fdba74; } .hero-chip.c-star { color: #fde047; }
.demo-banner { display: flex; align-items: flex-start; gap: 10px; line-height: 1.45; }
.demo-banner svg { flex: none; margin-top: 2px; }
.seg svg { margin-right: 6px; vertical-align: -3px; }
.btn .flag { border-radius: 3px; box-shadow: 0 0 0 1px #0004; }

/* ---- pied de page : mention + lien « Mise en place » */
.footer { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 22px; }
.foot-link { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; border-bottom: 1px dashed var(--border-strong); padding-bottom: 1px; transition: color .2s; }
.foot-link:hover, .foot-link:focus-visible { color: var(--text); }

/* ---- page « Mise en place » (#/setup) : SQL à copier, étapes, vérification des migrations */
.setup-page { max-width: 780px; display: grid; gap: 18px; align-content: start; }
.setup-head { display: flex; align-items: center; gap: 14px; }
.setup-ico { flex: none; width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; color: var(--accent-ink); background: var(--grad); box-shadow: 0 10px 30px -10px hsl(var(--h) 95% 60% / .6); }
.setup-page h1 { font-size: clamp(1.7rem, 5vw, 2.5rem); line-height: 1.1; }
.setup-lead { color: var(--muted); max-width: 62ch; }
.setup-demo { display: flex; align-items: flex-start; gap: 10px; padding: 12px 16px; border-radius: var(--radius-sm); line-height: 1.45; background: color-mix(in srgb, var(--info) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--info) 45%, transparent); }
.setup-demo svg { flex: none; margin-top: 2px; }
.setup-card { display: grid; gap: 14px; }
.setup-card > h3 { margin: 0; display: block; }
.setup-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 22px; counter-reset: setup; }
.setup-steps > li { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 16px; align-items: start; counter-increment: setup; }
.setup-steps > li::before { content: counter(setup); width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font: 800 1.15rem var(--font-display); color: var(--accent-ink); background: var(--grad); box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 18%, transparent); }
.setup-steps h3 { display: block; margin: 2px 0 4px; font-size: 1.15rem; }
.setup-steps p { margin: 0 0 12px; color: var(--muted); font-size: .94rem; max-width: 60ch; }
.setup-steps .btn { max-width: 100%; }
.setup-mig { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.setup-mig > li { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.setup-mig .n { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font: 800 .95rem var(--font-display); color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, transparent); }
.setup-mig b { display: block; font-weight: 700; }
.setup-mig .d { display: block; color: var(--muted); font-size: .9rem; line-height: 1.45; }
.setup-slot { display: inline-flex; min-height: 26px; align-items: center; }
.setup-st { white-space: nowrap; }
.setup-st-ok { color: var(--good); background: color-mix(in srgb, var(--good) 16%, transparent); border-color: color-mix(in srgb, var(--good) 45%, transparent); }
.setup-st-missing { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
.setup-warn, .note-warn { display: flex; align-items: flex-start; gap: 8px; margin: 0; padding: 10px 14px; border-radius: var(--radius-sm); line-height: 1.45; background: color-mix(in srgb, var(--warn) 12%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }
.setup-warn svg, .note-warn svg { flex: none; margin-top: 2px; color: var(--warn); }
.setup-warn[hidden], .note-warn[hidden] { display: none; }
.setup-check { gap: 10px 14px; }
.setup-msg { margin: 0; min-height: 1.3em; }
.setup-box > summary { cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 700; list-style: none; }
.setup-box > summary::-webkit-details-marker { display: none; }
.setup-box > summary::after { content: ""; flex: none; width: 8px; height: 8px; margin-left: 4px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .2s var(--ease); }
.setup-box[open] > summary::after { transform: rotate(-135deg); }
.setup-box > summary > .small { margin-left: auto; font-weight: 500; }
.setup-box-in { display: grid; gap: 12px; margin-top: 14px; justify-items: start; }
.setup-sql { display: block; width: 100%; height: 340px; max-height: 62vh; resize: vertical; font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; overflow: auto; tab-size: 2; }
@media (max-width: 560px) {
  .setup-steps > li { grid-template-columns: 34px minmax(0, 1fr); gap: 12px; }
  .setup-steps > li::before { width: 34px; height: 34px; font-size: 1rem; }
  .setup-steps .btn { width: 100%; justify-content: center; }
  .setup-mig > li { grid-template-columns: 32px minmax(0, 1fr); }
  .setup-mig .setup-slot { grid-column: 2; justify-self: start; }
}
@charset "UTF-8";
/* =====================================================================
   YunoParty — le salon : en-tête, scène (lecteur / jeux), chat, amis, barre vocale
   ===================================================================== */

.room { position: relative; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
.room-head { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px clamp(10px, 2vw, 18px); border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--bg) 60%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); z-index: 20; }
.room-head .spacer { flex: 1; }
.rh-party { display: inline-flex; align-items: center; gap: 10px; padding: 4px 12px 4px 6px; border-radius: 99px; border: 1px solid transparent; background: transparent; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; max-width: 46vw; transition: background .2s, border-color .2s; }
.rh-party:hover { background: var(--surface-2); border-color: var(--border); }
.rh-party .pi { flex: none; }
.rh-status { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 700; color: var(--muted); }
.rh-status .dot { width: 8px; height: 8px; }
.rh-status[data-s="connecting"] .dot { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 25%, transparent); animation: pulseRing 1.2s ease-out infinite; }
.rh-status[data-s="offline"] .dot { background: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 25%, transparent); }
.rh-faces { display: flex; align-items: center; }
.rh-faces .av { --sz: 30px; margin-left: -8px; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px color-mix(in srgb, var(--c) 70%, transparent); }
.rh-faces .av:first-child { margin-left: 0; }
.rh-more { margin-left: 6px; font-size: .8rem; font-weight: 800; color: var(--muted); }

.room-main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) clamp(300px, 27vw, 400px); gap: 14px; padding: 12px clamp(10px, 2vw, 18px) 0; }
.stage, .side { display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; }
.stage-tabs, .side-tabs { align-self: flex-start; flex: none; }
.side-tabs { align-self: stretch; } .side-tabs .tab { flex: 1; justify-content: center; }
.stage-view, .side-view { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; }
.stage-view > *, .side-view > * { flex: 1; min-height: 0; }
.room[data-stage="watch"] .stage-games, .room[data-stage="games"] .stage-watch { display: none; }
.room[data-side="chat"] .side-people, .room[data-side="people"] .side-chat { display: none; }
.tab .badge { margin-left: 2px; }
.tab .badge.dotty { min-width: 9px; width: 9px; height: 9px; padding: 0; background: var(--accent-2); animation: pulseRing 1.4s ease-out infinite; }

/* ------------------------------------------------------------------ chat */
.chat { display: flex; flex-direction: column; height: 100%; min-height: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.chat-scroll { position: relative; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.chat-list { display: flex; flex-direction: column; gap: 6px; padding: 14px 12px 8px; min-height: 100%; justify-content: flex-end; }
.msg { display: flex; align-items: flex-end; gap: 8px; }
.msg.fresh { animation: msgIn .35s var(--ease) both; }
@keyframes msgIn { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
.msg.me { flex-direction: row-reverse; }
.msg-col { display: flex; flex-direction: column; gap: 2px; max-width: 84%; min-width: 0; }
.msg.me .msg-col { align-items: flex-end; }
.msg-meta { display: flex; align-items: baseline; gap: 8px; font-size: .78rem; padding: 0 4px; }
.msg-meta time { color: var(--muted); font-size: .68rem; }
.msg-bub { padding: 8px 13px; border-radius: 18px 18px 18px 5px; background: var(--surface-2); border: 1px solid var(--border); overflow-wrap: anywhere; white-space: pre-wrap; line-height: 1.4; }
.msg.me .msg-bub { background: var(--grad); color: var(--accent-ink); border-color: transparent; border-radius: 18px 18px 5px 18px; }
.msg.me .msg-bub a { color: inherit; text-decoration: underline; }
.msg.cont .msg-bub { border-top-left-radius: 8px; } .msg.me.cont .msg-bub { border-top-right-radius: 8px; border-top-left-radius: 18px; }
.msg.pending { opacity: .6; }
.msg.sys { justify-content: center; font-size: .76rem; color: var(--muted); padding: 2px 0; }
.msg.sys span { padding: 3px 12px; border-radius: 99px; background: color-mix(in srgb, var(--surface-2) 70%, transparent); }
.av-gap { width: 30px; flex: none; }
.msg .av { --sz: 30px; }
.msg-watch { margin-top: 6px; }
.chat-empty { margin: auto; text-align: center; color: var(--muted); padding: 30px 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.chat-empty .emo { display: grid; place-items: center; color: var(--accent); animation: float 3s ease-in-out infinite; }
.chat-jump { position: sticky; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 3; width: max-content; margin: 0 auto; }
.chat-typing { flex: none; min-height: 20px; padding: 0 16px; font-size: .76rem; color: var(--muted); opacity: 0; transition: opacity .25s; }
.chat-typing.on { opacity: 1; }
.chat-form { flex: none; display: flex; align-items: flex-end; gap: 6px; padding: 8px; border-top: 1px solid var(--border); background: color-mix(in srgb, var(--surface-solid) 55%, transparent); }
.chat-form textarea.chat-input { resize: none; min-height: 42px; max-height: 120px; height: 42px; border-radius: 22px; padding: 10px 16px; line-height: 1.3; }

/* ------------------------------------------------------------------ lecteur */
.player { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.pl-empty { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.pl-hero { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; max-width: 620px; width: 100%; }
.pl-hero h3 { font-size: clamp(1.4rem, 3.4vw, 2rem); }
.pl-hero-art { position: relative; width: 150px; height: 110px; margin-bottom: 4px; }
.pl-hero-screen { position: absolute; inset: 0; display: grid; place-items: center; border-radius: 20px; color: #fff; background: var(--grad); box-shadow: 0 22px 40px -14px hsl(var(--h) 95% 55% / .7); animation: float 5s ease-in-out infinite; --r: -3deg; }
.pl-pop { position: absolute; line-height: 0; color: var(--accent-2); animation: float 4s ease-in-out infinite; filter: drop-shadow(0 6px 8px rgb(0 0 0 / .3)); }
.pl-pop.p1 { left: -26px; top: -8px; } .pl-pop.p2 { right: -22px; top: 6px; animation-delay: -1.3s; } .pl-pop.p3 { right: 8px; bottom: -22px; animation-delay: -2.4s; }
.pl-form { display: flex; gap: 8px; width: 100%; }
.pl-quick { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.pl-hints { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; opacity: .85; }
.pl-empty .pl-queue { width: 100%; max-width: 620px; }
.pl-stage { display: flex; flex-direction: column; gap: 10px; height: 100%; min-height: 0; overflow: auto; }
.pl-frame { position: relative; flex: 1 1 auto; min-height: 220px; background: #000; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border-strong); box-shadow: var(--shadow); }
.pl-slot, .pv-iframe, .pv-video, .pv-yt, .pv-yt iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.pv-video { object-fit: contain; background: #000; }
.pv-iframe { background: #fff; }
.pl-overlay { position: absolute; inset: 0; z-index: 2; background: transparent; border: 0; cursor: pointer; }
.pl-overlay[hidden] { display: none; }
.pl-gesture { position: absolute; inset: 0; z-index: 4; margin: auto; width: max-content; height: max-content; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 22px 28px; border-radius: 24px; border: 1px solid var(--border-strong); background: color-mix(in srgb, var(--surface-solid) 90%, transparent); color: var(--text); font-weight: 800; backdrop-filter: blur(10px); }
.pl-spin { position: absolute; inset: 0; z-index: 3; display: grid; place-items: center; background: rgb(0 0 0 / .35); pointer-events: none; }
.pl-error { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px; text-align: center; background: rgb(8 5 20 / .88); color: #fff; }
.pl-error .emo, .pl-wait .emo { display: grid; place-items: center; color: var(--accent-2); }
.pl-wait { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; color: #fff; background: linear-gradient(160deg, #1b1033, #0c0a1f); }
.pl-wait .muted { color: rgb(255 255 255 / .7); max-width: 34em; }
.pl-react { position: absolute; inset: 0; z-index: 6; pointer-events: none; overflow: hidden; }
.pl-bar { flex: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 12px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); }
.pl-controls { flex: 1 1 280px; display: flex; align-items: center; gap: 10px; min-width: 0; }
.pl-tools { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.pl-seek { flex: 1; min-width: 80px; height: 6px; }
.pl-time { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.pl-rate { width: auto; padding: 5px 8px; font-size: .82rem; }
.pl-volume { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.pl-vol { width: 84px; height: 5px; }
.pl-pp { width: 44px; height: 44px; }
.pl-info { flex: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 0 4px; }
.pl-by { display: inline-flex; align-items: center; gap: 6px; }
.pl-note { max-width: 46em; }
.pl-queue { flex: none; display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); }
.pl-queue:not(:has(.pl-qitem)) { display: none; }
.pl-empty .pl-queue:not(:has(.pl-qitem)) { display: none; }
.pl-qhead { display: flex; align-items: center; gap: 8px; }
.pl-qitem { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: .9rem; }
.pl-qitem .ellipsis { flex: 1; min-width: 0; }
.pl-qadd { display: flex; gap: 6px; }
.room.cinema .room-head, .room.cinema .side, .room.cinema .stage-tabs, .room.cinema .bottom-nav { display: none !important; }
.room.cinema .room-main { grid-template-columns: minmax(0, 1fr); padding: 0; gap: 0; }
.room.cinema .pl-frame { border-radius: 0; border: 0; }
.room.cinema .pl-stage { gap: 0; }
.room.cinema .pl-bar, .room.cinema .pl-info, .room.cinema .pl-queue { border-radius: 0; border-left: 0; border-right: 0; }
.room.cinema .dock { position: absolute; left: 0; right: 0; bottom: 74px; padding: 0 12px; opacity: .25; transition: opacity .3s; pointer-events: none; }
.room.cinema .dock:hover, .room.cinema .dock:focus-within { opacity: 1; }
.room.cinema .dock-in { pointer-events: auto; }

/* ------------------------------------------------------------------ amis */
.people { height: 100%; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.people-sec { margin: 10px 6px 4px; font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.people-sec:first-child { margin-top: 2px; }
.person { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 16px; transition: background .25s; }
.person:hover { background: var(--surface-2); }
.person.speaking { background: color-mix(in srgb, var(--good) 11%, transparent); }
.person.off { opacity: .5; }
.person .av { --sz: 42px; }
.p-info { flex: 1; min-width: 0; }
.p-name { display: flex; align-items: center; gap: 6px; font-weight: 700; }
.p-name b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-sub { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .74rem; color: var(--muted); }
.p-ico { display: inline-flex; align-items: center; gap: 3px; color: var(--muted); }
.p-ico.good { color: var(--good); } .p-ico.bad { color: var(--bad); } .p-ico.warn { color: var(--warn); }
.p-actions { display: flex; gap: 2px; flex: none; }
.p-menu { display: flex; flex-direction: column; gap: 4px; min-width: 190px; }
.p-menu .btn { justify-content: flex-start; }
.vol-pop { width: 220px; display: flex; flex-direction: column; gap: 10px; }
.people-hint { margin: 8px 6px; font-size: .84rem; color: var(--muted); }

/* ------------------------------------------------------------------ barre vocale */
.dock { flex: none; display: flex; justify-content: center; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); z-index: 15; }
.dock-in { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px; padding: 8px 12px; border-radius: 99px; background: var(--surface); border: 1px solid var(--border-strong); box-shadow: var(--shadow); -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3); }
.dock .btn.icon { width: 46px; height: 46px; }
.dock-sep { width: 1px; height: 26px; background: var(--border-strong); margin: 0 2px; }
.dock-note { max-width: 250px; font-size: .78rem; line-height: 1.25; color: var(--muted); padding: 0 6px; }
.dock-note.warn { color: var(--warn); }

.cb { position: absolute; inset: 0; display: flex; flex-direction: column; background: #05050d; color: var(--text); }

.cb-stage { position: relative; flex: 1 1 auto; min-height: 0; display: grid; place-items: center; background: #05050d; overflow: hidden; }
.cb-surface { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 100%; background: #000; outline: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: default; }
.cb-surface.focus { box-shadow: 0 0 0 2px var(--accent) inset; }
.cb-canvas { display: block; width: 100%; height: 100%; }
.cb-cursors { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.cb-cur { position: absolute; left: 0; top: 0; opacity: 0; transition: left .09s linear, top .09s linear, opacity .25s; will-change: left, top; }
.cb-cur.on { opacity: 1; }
.cb-cur-arrow { display: block; filter: drop-shadow(0 2px 3px rgb(0 0 0 / .55)); }
.cb-cur-name { position: absolute; left: 16px; top: 16px; padding: 1px 8px; border-radius: 99px; font-size: .68rem; font-weight: 700; white-space: nowrap; color: #0b0b1a; background: var(--c); box-shadow: 0 2px 8px rgb(0 0 0 / .4); }
.cb-cur.click .cb-cur-arrow { animation: cbClick .45s ease-out; }
@keyframes cbClick { 0% { transform: scale(1); } 35% { transform: scale(.78); } 100% { transform: scale(1); } }
.cb-progress { position: absolute; left: 0; right: 0; top: 0; height: 3px; overflow: hidden; background: rgb(255 255 255 / .1); }
.cb-progress i { display: block; width: 35%; height: 100%; background: var(--grad); border-radius: 3px; animation: cbLoad 1.1s ease-in-out infinite; }
@keyframes cbLoad { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
.cb-lock { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 99px; font-size: .8rem; font-weight: 700; background: rgb(10 10 25 / .86); border: 1px solid var(--border-strong); animation: fadeIn .2s both; }
.cb-kbd { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; padding: 0; border: 0; opacity: 0; resize: none; pointer-events: none; font-size: 16px; /* 16px : iOS ne zoome pas */ }
.cb-overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 18px; background: radial-gradient(600px 300px at 50% 30%, hsl(var(--h) 60% 20% / .9), #05050d); overflow: auto; z-index: 2; }
.cb-overlay[hidden] { display: none; }
.cb-card { display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 460px; text-align: center; animation: bounceIn .5s var(--bounce) both; }
.cb-card h3 { margin: 0; font-size: 1.25rem; }
.cb-card p { margin: 0; }
.cb-card-ic { display: grid; place-items: center; width: 72px; height: 72px; border-radius: 24px; color: #fff; background: var(--grad); box-shadow: var(--glow); animation: float 4s ease-in-out infinite; }
.cb-card-ic.bad { background: linear-gradient(135deg, #fb7185, #f59e0b); }
.cb-code { margin: 4px 0; padding: 10px 14px; max-width: 100%; overflow-x: auto; text-align: left; font: .78rem/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #c7f9d4; background: rgb(0 0 0 / .45); border: 1px solid var(--border); border-radius: 12px; white-space: pre; }
.player[data-kind="cloud"] .pl-frame { min-height: 320px; }
@media (max-width: 899px) {
  .cb-who, .cb-eco { display: none; }
  .cb-bar { gap: 2px; padding: 4px 6px; }
  .cb-btn.btn.icon.sm { width: 40px; height: 40px; }
  .cb-addr.input { height: 40px; font-size: 16px; }
  /* navigateur partagé : il prend tout le panneau (le chat reste à un toucher, dans la barre du bas) */
  .room[data-pane="watch"][data-video="cloud"] .stage { flex: 1; padding: 0; }
  .room[data-pane="watch"][data-video="cloud"] .side { display: none; }
  .room[data-pane="watch"][data-video="cloud"] .pl-frame { flex: 1; aspect-ratio: auto; border-radius: 0; border-left: 0; border-right: 0; }

@media (hover: none) { .cb-kbd-btn { color: var(--accent); } }

  .player[data-kind="cloud"] .pl-bar, .player[data-kind="cloud"] .pl-info, .player[data-kind="cloud"] .pl-queue { display: none; }
}

@charset "UTF-8";
/* =====================================================================
   Briques visuelles communes à toutes les activités (.act-root)
   Réutilise les variables de base.css (--accent, --surface, …)
   ===================================================================== */

.act-root { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 760px; margin: 0 auto; padding: 4px 2px 24px; animation: fadeIn .35s var(--ease) both; }
.act-root.wide { max-width: 980px; }

/* mise en page */
.g-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.g-row.center { justify-content: center; }
.g-row.between { justify-content: space-between; }
.g-col { display: flex; flex-direction: column; gap: 10px; }
.g-col.center { align-items: center; text-align: center; }
.g-grid { display: grid; gap: 10px; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); }
.g-spacer { flex: 1; }
.g-center { text-align: center; }

/* textes */
.g-title { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; }
.g-sub { color: var(--muted); font-size: .92rem; }
.g-muted { color: var(--muted); }
.g-big { font-family: var(--font-display); font-size: clamp(1.4rem, 4.6vw, 2.1rem); font-weight: 700; line-height: 1.2; }
.g-huge { font-family: var(--font-display); font-size: clamp(2.6rem, 11vw, 5rem); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.g-good { color: var(--good); } .g-bad { color: var(--bad); } .g-warn { color: var(--warn); }

/* panneaux et cartes */
.g-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.g-panel.flat { background: color-mix(in srgb, var(--surface-solid) 60%, transparent); }
.g-card {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center;
  min-height: 210px; padding: 28px 22px; border-radius: var(--radius-lg);
  background: linear-gradient(150deg, color-mix(in srgb, var(--accent) 24%, var(--surface-solid)), color-mix(in srgb, var(--accent-2) 20%, var(--surface-solid)));
  border: 1px solid var(--border-strong); box-shadow: var(--shadow), var(--glow); overflow: hidden;
}
.g-card::before { content: ''; position: absolute; inset: -40% -20% auto auto; width: 70%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, rgb(255 255 255 / .18), transparent 65%); pointer-events: none; }
.g-card.flip { animation: flipIn .55s var(--ease) both; }
.g-card .tag { position: absolute; top: 12px; left: 14px; font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
.g-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--border); font-size: .82rem; font-weight: 700; }
.g-notice { padding: 22px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--border-strong); border-radius: var(--radius); }
.g-notice .emo { font-size: 2.2rem; display: block; margin-bottom: 6px; }

/* boutons : réutiliser .btn, .btn.primary, .btn.ghost, .btn.soft, .btn.sm, .btn.lg */
.g-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

/* classement */
.g-lb { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.g-lb li { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--radius-sm); background: var(--surface); border: 1px solid var(--border); animation: slideInLeft .4s var(--ease) both; animation-delay: calc(var(--i, 0) * 50ms); }
.g-lb li.me { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.g-lb .rank { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .85rem; background: var(--surface-2); color: var(--muted); }
.g-lb .rank.r1 { background: linear-gradient(145deg, #fde68a, #f59e0b); color: #3b2200; box-shadow: 0 0 14px -2px #fbbf2499; }
.g-lb .rank.r2 { background: linear-gradient(145deg, #f1f5f9, #94a3b8); color: #1e293b; }
.g-lb .rank.r3 { background: linear-gradient(145deg, #fdba74, #b45309); color: #2b1300; }
.g-lb .who { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; font-weight: 600; }
.g-lb .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-lb .val { font-family: var(--font-display); font-weight: 800; font-variant-numeric: tabular-nums; }

/* barres */
.g-bar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.g-bar > i { display: block; height: 100%; width: calc(var(--p, 0) * 1%); background: var(--grad); border-radius: inherit; transition: width .3s linear; }
.g-bar.thick { height: 22px; }
.g-vote { position: relative; overflow: hidden; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); }
.g-vote > i { position: absolute; inset: 0 auto 0 0; width: calc(var(--p, 0) * 1%); background: color-mix(in srgb, var(--accent) 30%, transparent); transition: width .45s var(--ease); }
.g-vote > span { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; font-weight: 600; }

/* choix (quiz, vote) */
.g-opts { display: grid; gap: 10px; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); }
.g-opt { border: 1px solid var(--border-strong); background: var(--surface); border-radius: var(--radius-sm); padding: 14px 12px; font-weight: 700; text-align: center; transition: transform .2s var(--bounce), background .2s, border-color .2s; }
.g-opt:hover:not([disabled]) { transform: translateY(-2px); border-color: var(--accent); }
.g-opt.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 25%, var(--surface)); }
.g-opt.ok { border-color: var(--good); background: color-mix(in srgb, var(--good) 28%, var(--surface)); animation: pop .45s var(--bounce); }
.g-opt.ko { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 24%, var(--surface)); animation: shake .4s; }
.g-opt[disabled] { cursor: default; }

/* plateaux */
.g-board { display: grid; gap: var(--gap, 6px); grid-template-columns: repeat(var(--cols, 3), 1fr); width: min(100%, var(--max, 420px)); margin: 0 auto; touch-action: manipulation; }
.g-cell { aspect-ratio: 1; display: grid; place-items: center; border-radius: var(--cr, 14px); border: 1px solid var(--border); background: var(--surface); font-size: var(--fs, 2.2rem); font-weight: 800; line-height: 1; padding: 0; transition: background .2s, transform .2s var(--bounce); }
button.g-cell:hover:not([disabled]) { background: var(--surface-2); transform: scale(1.04); }
.g-cell.win { background: color-mix(in srgb, var(--good) 35%, var(--surface)); animation: pop .5s var(--bounce); }
.g-cell .piece { animation: bounceIn .4s var(--bounce); }

/* chrono / compte à rebours */
.g-count { font-family: var(--font-display); font-weight: 800; font-size: clamp(4rem, 22vw, 8rem); line-height: 1; text-align: center; background: var(--grad-3); -webkit-background-clip: text; background-clip: text; color: transparent; animation: bounceIn .5s var(--bounce) both; }
.g-timer { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; font-variant-numeric: tabular-nums; }

  <script>
(function () {

// Mini chargeur « System.register », collé dans le fichier unique par tools/build-single.mjs.
// Il exécute les modules fusionnés par tsc (--module system) avec la sémantique des modules ES :

// Ce fichier ne contient qu'une déclaration de fonction : le script de fabrication l'appelle (createSystem()),
